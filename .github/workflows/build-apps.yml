name: Test and build Android, iOS and macOS apps

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  ai-regression:
    name: AI engine regression
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvm/fvm_config.json
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run AI regression tests
        run: >-
          flutter test --no-pub
          test/xqlite_search_hash_test.dart
          test/xqlite_search_effectiveness_test.dart
          test/chess_engine_strength_test.dart
          test/xqlite_time_budget_test.dart
          test/position_evaluation_test.dart
          test/engine_skill_benchmark_test.dart

  android:
    name: Android APK
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvm/fvm_config.json
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-pub

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS app
    if: github.event.pull_request.merged == true
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvm/fvm_config.json
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/Runner-unsigned.zip

      - name: Upload iOS app
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-app
          path: build/ios/Runner-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS app
    if: github.event.pull_request.merged == true
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvm/fvm_config.json
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --no-pub

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/flutter_cchess.app build/macos/flutter_cchess-macos.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: build/macos/flutter_cchess-macos.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event.pull_request.merged == true
    needs: [ai-regression, android, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Download Android APK
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: release/android

      - name: Download iOS app
        uses: actions/download-artifact@v7
        with:
          name: ios-unsigned-app
          path: release/ios

      - name: Download macOS app
        uses: actions/download-artifact@v7
        with:
          name: macos-app
          path: release/macos

      - name: Prepare release assets and metadata
        id: release
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read the app version from pubspec.yaml" >&2
            exit 1
          fi
          tag_version="${version/+/-build-}"
          mkdir -p release/assets
          cp release/android/app-release.apk release/assets/flutter-cchess-android.apk
          cp release/ios/Runner-unsigned.zip release/assets/flutter-cchess-ios-unsigned.zip
          cp release/macos/flutter_cchess-macos.zip release/assets/flutter-cchess-macos-unsigned.zip
          printf 'tag=v%s-pr%s\n' "$tag_version" "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'title=v%s (PR #%s)\n' "$version" "$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          assets=(
            release/assets/flutter-cchess-android.apk
            release/assets/flutter-cchess-ios-unsigned.zip
            release/assets/flutter-cchess-macos-unsigned.zip
          )
          notes="Automated build for merged PR #${PR_NUMBER} at ${MERGE_SHA}. The iOS and macOS packages are unsigned."
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MERGE_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$notes" \
              --prerelease
          fi
