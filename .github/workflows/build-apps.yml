name: Build Android, iOS and macOS apps

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvm/fvm_config.json
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-pub

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvm/fvm_config.json
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/Runner-unsigned.zip

      - name: Upload iOS app
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-app
          path: build/ios/Runner-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvm/fvm_config.json
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --no-pub

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/flutter_cchess.app build/macos/flutter_cchess-macos.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: build/macos/flutter_cchess-macos.zip
          if-no-files-found: error
          retention-days: 7
